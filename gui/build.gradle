    compile('com.jgoodies:jgoodies-forms:1.6.0')            // have jgoodies-common.jar v:1.4.0 in dependencies
    compile('com.jgoodies:jgoodies-looks:2.5.2')
    compile('com.jgoodies:jgoodies-binding:2.7.0'){ transitive = false }
