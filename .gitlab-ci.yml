stages:
  - prepare
  - build
  - test
  - release
  - publish
  - trigger
  - clean-up
  - promote

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

"Prepare":
  stage: prepare
  script:
    - export CI_PUSH_URL=`echo $CI_REPOSITORY_URL | perl -pe 's#.*@(.+?(\:\d+)?)/#git@\1:#'`
    - echo $CI_PUSH_URL
    - git config user.name "Robot"
    - git config user.email "<internal@rtmath.net>"
    - git checkout -b pipeline-$CI_PIPELINE_ID
    - versionSnapshot=`grep 'version=' gradle.properties | sed 's/version=\([^-]*\)/\1/'`
    - versionRelease=`echo $versionSnapshot | sed 's/\([^-]*\)-SNAPSHOT/\1/'`
    - versionSnapshotNext=`echo $versionSnapshot | perl -pe 's/^((\d+\.)*)(\d+)(.*)$/$1.($3+1).$4/e'`
    - echo "$versionSnapshot -> $versionRelease  -> $versionSnapshotNext"
    - sed -i "s/version=$versionSnapshot/version=$versionRelease/" gradle.properties
    - git commit -am "[Skip CI] Generate release version"
    - sed -i "s/version=$versionRelease/version=$versionSnapshotNext/" gradle.properties
    - git commit -am "[Skip CI] Generate next development version"
    - git remote set-url --push origin "${CI_PUSH_URL}"
    - git push origin -u pipeline-$CI_PIPELINE_ID
  tags:
    - Linux
    - ShellExecutor
  only:
    - /^release-.*$/
  except:
    - tags

"Build":
  stage: build
  image: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}/gitlabci.docker/openjdk-11-gradle-5.4.1:latest
  script:
    - git checkout origin/pipeline-$CI_PIPELINE_ID~1 || true
    - ./gradlew build :util:downloadCodes test --no-daemon :dependencyCheckAggregate
  artifacts:
    paths:
      - libs/
  tags:
    - DockerExecutor
  except:
    - tags
    - schedules

"Test":
  stage: test
  image: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}/gitlabci.docker/openjdk-11-gradle-5.4.1:latest
  only:
    - schedules
  script:
    - ./gradlew check --parallel
  artifacts:
    name: "${CI_JOB_ID}_${CI_JOB_NAME}"
    when: always
    expire_in: 30 day
    paths:
      - build/reports/spotbugs/main.html
  tags:
    - DockerExecutor

"Release":
  stage: release
  script:
    - export CI_PUSH_URL=`echo $CI_REPOSITORY_URL | perl -pe 's#.*@(.+?(\:\d+)?)/#git@\1:#'`
    - git config user.name "Robot"
    - git config user.email "<internal@rtmath.net>"
    - git remote set-url --push origin "${CI_PUSH_URL}"
    - git checkout origin/pipeline-$CI_PIPELINE_ID~1
    - versionRelease=`grep 'version=' gradle.properties | sed 's/version=\([^-]*\)/\1/'`
    - echo $versionRelease
    - git tag $versionRelease
    - git push origin $versionRelease
    - git checkout origin/pipeline-$CI_PIPELINE_ID
    - git push origin origin/pipeline-$CI_PIPELINE_ID:${CI_BUILD_REF_NAME}
  tags:
    - Linux
    - ShellExecutor
  only:
    - /^release-.*$/
  except:
    - tags

"Publish":
  stage: publish
  image: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}/gitlabci.docker/openjdk-11-gradle-5.4.1:latest
  script:
    - git checkout origin/pipeline-$CI_PIPELINE_ID~1
    - ./gradlew publish
  dependencies:
    - "Build"
  only:
    - /^release-.*$/
  tags:
    - DockerExecutor
  except:
    - tags
    - schedules

"Trigger GitLab Release":
  stage: trigger
  image: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}/gitlabci.docker/openjdk-11-gradle-5.4.1:latest
  script:
    - git checkout origin/pipeline-$CI_PIPELINE_ID~1 || true
    - ./gradlew gitlabRelease -i -S
  only:
    - /^release-.*$/
  tags:
    - Linux
    - DockerExecutor
    - AWS

"Clean Up":
  stage: clean-up
  script:
    - export CI_PUSH_URL=`echo $CI_REPOSITORY_URL | perl -pe 's#.*@(.+?(\:\d+)?)/#git@\1:#'`
    - git config user.name "Robot"
    - git config user.email "<internal@rtmath.net>"
    - git remote set-url --push origin "${CI_PUSH_URL}"
    - git push origin --delete pipeline-$CI_PIPELINE_ID
  only:
    - /^release-.*$/
  when: always
  tags:
    - Linux
    - ShellExecutor
  except:
    - tags

"Promote to public":
  stage: promote
  cache: {} # Disable cache for this job because this job does not uses any data from the cache
  script:
    - ./gradlew promoteToPublic
  only:
    - /^release-.*$/
  when: manual
  except:
    - tags
    - schedules
  dependencies: [] # Dependencies for manual tasks are not supported by GitLab: https://gitlab.com/gitlab-org/gitlab/-/issues/15567
  tags:
    - Linux
    - ShellExecutor

dependency-check:
  stage: test
  image: ${ARTIFACTORY_DOCKER_DEV_REPOSITORY}/gitlabci.docker/openjdk-11-gradle-5.4.1:latest
  only:
    - schedules
  script:
    - ./gradlew :dependencyCheckAggregate
  artifacts:
    name: "${CI_JOB_ID}_${CI_JOB_NAME}"
    when: always
    expire_in: 30 day
    paths:
      - build/reports/dependency-check-report.html
