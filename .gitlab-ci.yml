stages:
  - prepare
  - build
  - test
  - release
  - publish
  - clean-up 
# Overwrite Gradle cache directory.
before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

# Tell GitLab to cache it between jobs.
cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

# Prepares release (remove "snapshot" from version, commit, bump version push and add "snapshot", commit, push to a dedicated branch)
"Prepare":
    stage: prepare
    script:
        - env
        - export CI_PUSH_REPO=`echo $CI_REPOSITORY_URL | perl -pe 's#.*@(.+?(\:\d+)?)/#git@\1:#'`
        - echo $CI_PUSH_REPO
        - git config user.name "Robot"
        - git config user.email "<internal@rtmath.net>"
        - git checkout -b pipeline-$CI_PIPELINE_ID
        - ./gradlew prepareReleaseVersion --no-daemon
        - git commit -am "[Skip CI] Generate release version"
        - ./gradlew prepareSnapshotVersion --no-daemon
        - git commit -am "[Skip CI] Generate next development version"
        - git remote set-url --push origin "${CI_PUSH_REPO}"
        - git push origin -u pipeline-$CI_PIPELINE_ID
    tags:
        - Linux
        - ShellExecutor
    only:
        - /^release-.*$/
    except:
        - tags
        - schedules

# Builds and tests release
"Build: Java 8":
    stage: build
    image: packages.deltixhub.com/gitlabci.docker/library/openjdk-8-gradle-5.4.1:latest
    script:
        - git checkout origin/pipeline-$CI_PIPELINE_ID~1 || true
        - ./gradlew build test --no-daemon
    artifacts:
        paths:
          - libs/
    tags:
        - DockerExecutor
    except:
        - tags
        - schedules

# Tests code (for scheduled checks)
"Test":
  stage: test
  image: packages.deltixhub.com/gitlabci.docker/library/openjdk-8-gradle-5.4.1:latest
  only:
    - schedules
  script:
    - ./gradlew check --parallel
  artifacts:
    name: "${CI_JOB_ID}_${CI_JOB_NAME}"
    when: always
    expire_in: 30 day
    paths:
      - build/reports/spotbugs/main.html
  tags:
    - DockerExecutor

# Checks dependencies (for scheduled checks)
dependency-check:
  stage: test
  image: packages.deltixhub.com/gitlabci.docker/library/openjdk-8-gradle-5.4.1:latest
  only:
    - schedules
  script:
    - ./gradlew :dependencyCheckAggregate
  artifacts:
    name: "${CI_JOB_ID}_${CI_JOB_NAME}"
    when: always
    expire_in: 30 day
    paths:
      - build/reports/dependency-check-report.html

# Executes release (creates tag)
"Release":
    stage: release
    script:
        - export CI_PUSH_REPO=`echo $CI_REPOSITORY_URL | perl -pe 's#.*@(.+?(\:\d+)?)/#git@\1:#'`
        - git config user.name "Robot"
        - git config user.email "<internal@rtmath.net>"
        - git remote set-url --push origin "${CI_PUSH_REPO}"
        - git checkout origin/pipeline-$CI_PIPELINE_ID~1
        - ./gradlew pushVersion --no-daemon
        - git checkout origin/pipeline-$CI_PIPELINE_ID
        - git push origin origin/pipeline-$CI_PIPELINE_ID:${CI_BUILD_REF_NAME}
    tags:
        - Linux
        - ShellExecutor
    only:
        - /^release-.*$/
    except:
        - tags
        - schedules

# Published built release artifacts
"Publish: Java 8":
    stage: publish
    image: packages.deltixhub.com/gitlabci.docker/library/openjdk-8-gradle-5.4.1:latest
    script:
        - git checkout origin/pipeline-$CI_PIPELINE_ID~1
        - ./gradlew publish
    dependencies:
        - "Build: Java 8"
    only:
        - /^release-.*$/
    tags:
        - DockerExecutor
    except:
        - tags
        - schedules

# Clean up after release
"Clean Up":
    stage: clean-up
    script:
        - export CI_PUSH_REPO=`echo $CI_REPOSITORY_URL | perl -pe 's#.*@(.+?(\:\d+)?)/#git@\1:#'`
        - git config user.name "Robot"
        - git config user.email "<internal@rtmath.net>"
        - git remote set-url --push origin "${CI_PUSH_REPO}"
        - git push origin --delete pipeline-$CI_PIPELINE_ID
    only:
        - /^release-.*$/
    when: always
    tags:
        - Linux
        - ShellExecutor
    except:
        - tags
        - schedules