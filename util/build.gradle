description = 'QuantServer general purpose utilities'

dependencies {
    compile project(':lang'),
            project(':collections')

    compile 'deltix:deltix-gflog-api'
    compile ('deltix:deltix-gflog-dcl') { transitive = false }
    runtime 'deltix:deltix-gflog-core'

    compile 'deltix:deltix-thread-affinity'

    implementation 'org.apache.commons:commons-lang3'
    compile 'org.apache.commons:commons-compress:1.7'

    compile 'javax.xml.bind:jaxb-api:2.2.8'
    compile 'com.sun.xml.bind:jaxb-impl:2.3.0'
    compile 'com.sun.xml.bind:jaxb-core:2.3.0'

//    compile('com.sun.xml.bind:jaxb-xjc:2.2.11')  // 2.2.11 has only bug fixes compared 2.2.8-b130911.1802 (which used by Java 8)
    //compile 'org.glassfish.jaxb:jaxb-runtime:2.2.11'  // Glassfish replaces JAXB RI
    //compile('javax.xml:jsr173:1.0'){ transitive = false }

    compile('net.java.dev.jna:jna:4.2.1'){ transitive = false }
    compile('net.java.dev.jna:jna-platform:4.2.1'){ transitive = false }
    compile('org.apache.bcel:bcel:6.0'){ transitive = false }
}

task downloadCodes(type: Download) {
    src 'https://smi.deltixhub.com/api/v1/currencyinfo/xml'
    dest new File(projectDir, 'src/main/resources/deltix/util/currency/CurrencyCodes.xml')
}

build.dependsOn(downloadCodes)