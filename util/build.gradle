description = 'QuantServer general purpose utilities'

dependencies {
    api project(':lang')
    implementation project(':collections')

    implementation 'deltix:deltix-gflog-api'
    implementation ('deltix:deltix-gflog-dcl') { transitive = false }
    runtimeOnly 'deltix:deltix-gflog-core'

    implementation 'deltix:deltix-thread-affinity'
    implementation 'javax.mail:mail'

    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-compress:1.7'

    implementation 'javax.xml.bind:jaxb-api:2.2.8'
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.0'
    implementation 'com.sun.xml.bind:jaxb-core:2.3.0'

//    compile('com.sun.xml.bind:jaxb-xjc:2.2.11')  // 2.2.11 has only bug fixes compared 2.2.8-b130911.1802 (which used by Java 8)
    //compile 'org.glassfish.jaxb:jaxb-runtime:2.2.11'  // Glassfish replaces JAXB RI
    //compile('javax.xml:jsr173:1.0'){ transitive = false }

    implementation('net.java.dev.jna:jna:4.2.1'){ transitive = false }
    implementation('net.java.dev.jna:jna-platform:4.2.1'){ transitive = false }
    implementation('org.apache.bcel:bcel:6.0'){ transitive = false }
}

task downloadCodes(type: Download) {
    src 'https://smi.deltixhub.com/api/v1/currencyinfo/xml'
    dest new File(projectDir, 'src/main/resources/deltix/util/currency/CurrencyCodes.xml')
}
