description = 'QuantServer general purpose utilities'

configurations {
    antlrGenerator
}

dependencies {
    api project(':lang'),
        project(':collections')

    compileOnly 'org.jetbrains:annotations'

    implementation 'deltix:deltix-thread-affinity'
    implementation 'javax.mail:mail'

    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-compress'

    api 'javax.xml.bind:jaxb-api:2.3.1'
    api 'com.sun.xml.bind:jaxb-impl:2.3.0'
    api 'com.sun.xml.bind:jaxb-core:2.3.0'

    implementation 'org.green:green-jelly:0.1.0'

    implementation('org.apache.bcel:bcel:6.6.0')

    implementation 'com.nimbusds:nimbus-jose-jwt:9.40'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'com.github.scribejava:scribejava-apis:8.3.3'

    testImplementation 'com.google.guava:guava' // Removable

    // https://gitlab.deltixhub.com/Deltix/Common/nativeclock
    implementation('deltix:deltix-clock')

    implementation group: 'org.antlr', name: 'antlr4-runtime', version: '4.6'
    antlrGenerator group: 'org.antlr', name: 'antlr4', version: '4.6'

    testImplementation 'org.hdrhistogram:HdrHistogram'
    testImplementation 'org.mockito:mockito-core'
}

tasks.register('downloadCodes', Download) {
    src 'https://smi.deltixhub.com/api/v2/currencyinfo/xml'
    dest new File(projectDir, 'src/main/resources/deltix/util/currency/CurrencyCodes.xml')
}

tasks.named('processResources').configure {
    mustRunAfter 'downloadCodes'
}

tasks.named('sourcesJar').configure {
    mustRunAfter 'downloadCodes'
}

tasks.register('buildFatTestJar', Jar) {
    group = 'build'
    description = 'Assembles a jar archive containing the test classes and all dependencies'

    manifest {
        attributes "Main-Class": "deltix.util.time.FrequentTimePollingStressTest"
    }

    from {
        configurations.testRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from sourceSets.main.output
    from sourceSets.test.output

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    archiveClassifier = 'testFat'
}


// Synthetic Rule parser generator
def generatedAntlrDir = file('build/generated-src/antlr')
def grammarPath = "src/main/resources/antlr/SyntheticRule.g4"
def packageName = "deltix.qsrv.hf.framework.mdp.impl.parser.generated"
def generatedPath = "$generatedAntlrDir/deltix/qsrv/hf/framework/mdp/impl/parser/generated/"

tasks.register('generateSyntheticRuleGrammar', JavaExec) {
    group = "antlr"
    description = "Generates ANTLR files (Lexer, Parser, Visitor, etc.)"

    classpath = configurations.antlrGenerator
    mainClass = "org.antlr.v4.Tool"

    args = [
            grammarPath,
            "-package", packageName,
            "-o", generatedPath,
            "-no-listener",
            "-visitor"
    ]

    inputs.file(file(grammarPath))
            .withPropertyName("grammarFile")
            .withPathSensitivity(PathSensitivity.RELATIVE)

    outputs.dir(file(generatedPath))
            .withPropertyName("outputDir")
}

sourceSets.main.java.srcDirs generatedAntlrDir

tasks.compileJava {
    dependsOn generateSyntheticRuleGrammar
}
tasks.processResources {
    dependsOn generateSyntheticRuleGrammar
}