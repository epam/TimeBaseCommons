plugins {
    id "me.champeau.gradle.jmh" version "0.3.1"
}

description = 'QuantServer commons-lang set of utilities'

dependencies {
    compile group: 'deltix', name: 'deltix-dfp', version: dfpVersion
    compile group: 'deltix', name: 'hd-date-time', version: hdTimeVersion
    compile 'deltix:deltix-gflog-api'
}

jmh {
    jmhVersion = '1.19'
}