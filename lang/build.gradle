plugins {
    id 'me.champeau.gradle.jmh' version '0.4.5' apply false
}

description = 'QuantServer commons-lang set of utilities'

dependencies {
    compile group: 'com.epam.deltix', name: 'dfp', version: dfpVersion
    compile group: 'deltix', name: 'hd-date-time', version: hdTimeVersion
    compile 'deltix:deltix-gflog-api'

    // For JMH-based tests
    testCompile 'org.openjdk.jmh:jmh-core'
    testCompile 'org.openjdk.jmh:jmh-generator-annprocess'
}