plugins {
    id "me.champeau.gradle.jmh" version "0.3.1"
}

description = 'QuantServer commons-lang set of utilities'

// Note: Gradle JMH plugin does not understand implicit versions. So if you want to run it's tasks then you have to add explicit versions for all dependencies.
dependencies {
    compile 'deltix:deltix-thread-affinity'
}

jmh {
    jmhVersion = '1.19'
}