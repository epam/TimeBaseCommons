timeStampMs        Time
timeStampMs.doc    \
Time in this field is measured in milliseconds that passed since January 1, 1970 UTC.\n\
For inbound messages special constant {link TIMESTAMP_UNKNOWN} marks 'unknown' timestamp in which case TimeBase server stores message using current server time.

nanoTime           Nanoseconds Component
nanoTime.doc       \
Nanoseconds component of timestamp. Generally speaking value must be in range from [ 0 to 999999 ],\n\
but system handles any value (nanosComponent simply added to timestamp converted to nanoseconds).
