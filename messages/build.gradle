plugins {
    id 'me.champeau.gradle.jmh' version '0.4.5' apply false
}

configurations {
    dojoGenerator
    luminary
}

def generatedDirectory = file('build/generated-src/main')
sourceSets.main.java.srcDirs generatedDirectory

dependencies {
    dojoGenerator "deltix:dojo-generator:${dojoGeneratorVersion}"

    luminary "deltix.qsrv:deltix-timebase-api-messages:${apiMessagesVersion}:luminary@jar"

    compile project(":collections")
    compile "deltix.qsrv:deltix-timebase-api-messages:${apiMessagesVersion}"
}

def luminarySearchPath = configurations.luminary.files.join(File.pathSeparator)

task generate(type: JavaExec) {
    main = "deltix.dojo.generator.Generator"
    classpath = configurations.dojoGenerator
    args = ["$projectDir/schema/DeltixTimebaseCommonMessages.json", "$projectDir/schema/JavaTimeBaseGenerator.json", generatedDirectory]
    environment LUMINARY_SEARCH_PATH: luminarySearchPath
}

compileJava.dependsOn generate

description = 'QuantServer Messages Interfaces'
